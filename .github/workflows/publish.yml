name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Without this a stalled step burns the full 6h runner limit before anyone
    # notices the release did not publish. A hung apt mirror already cost one
    # release that way. Sized for the worst case of its steps: apt retries, then
    # the unit and e2e suites, both of which run their files serially.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure sandboxing
        timeout-minutes: 15
        run: |
          # Acquire::*::Timeout only guards a single socket operation, so a mirror
          # that stalls once the headers are in never trips it -- that ate a 6h
          # runner limit, then a 5min step cap. Kill each attempt from the outside
          # and retry the fetch instead. No Acquire::Retries: apt retrying inside a
          # killed window would just burn the budget without ever finishing.
          #
          # The per-attempt budgets are generous on purpose. When the image's
          # package lists are stale, a healthy `update` pulls ~5MB of indexes and
          # takes about two minutes; a tighter cap killed it mid-download three
          # times in a row and turned "slow but fine" into a failed release.
          # Languages=none drops the Translation-* files, which nothing here reads.
          apt_opts=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Languages=none)
          for attempt in 1 2; do
            if timeout 300 sudo apt-get "${apt_opts[@]}" update \
              && timeout 120 sudo apt-get "${apt_opts[@]}" install --yes bubblewrap; then
              installed=yes
              break
            fi
            echo "apt attempt ${attempt} stalled or failed, retrying"
            sleep 10
          done
          if [ -z "${installed:-}" ]; then
            echo "::error::bubblewrap install failed after 3 attempts"
            exit 1
          fi
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  bundle:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            triple: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            executable: dist/release-bin/codex-acp
          - runner: macos-15-intel
            platform: darwin-x64
            triple: x86_64-apple-darwin
            bun-target: bun-darwin-x64-baseline
            executable: dist/release-bin/codex-acp
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            triple: aarch64-unknown-linux-musl
            bun-target: bun-linux-arm64
            executable: dist/release-bin/codex-acp
          - runner: ubuntu-24.04
            platform: linux-x64
            triple: x86_64-unknown-linux-musl
            bun-target: bun-linux-x64-baseline
            executable: dist/release-bin/codex-acp
          - runner: windows-11-arm
            platform: win32-arm64
            triple: aarch64-pc-windows-msvc
            bun-target: bun-windows-arm64
            executable: dist/release-bin/codex-acp.exe
          - runner: windows-2025
            platform: win32-x64
            triple: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
            executable: dist/release-bin/codex-acp.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: npm ci
      - name: Compile adapter
        run: >-
          bun build src/index.ts --minify --sourcemap --compile
          --target=${{ matrix.bun-target }}
          --outfile=${{ matrix.executable }}
      - name: Package adapter with matching Codex runtime
        run: >-
          node scripts/package-release.mjs
          ${{ matrix.platform }}
          ${{ matrix.triple }}
          ${{ matrix.executable }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist/release
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
          files: dist/release/*.tar.gz
